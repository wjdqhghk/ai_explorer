
name: 앱 깨어 있게 하기 (keep awake)

on:
  schedule:
    # 4시간마다 (12시간 제한보다 넉넉하게). 깃허브 예약은 몇십 분 늦을 수 있어
    # 6시간이 아니라 4시간으로 잡아 여유를 둔다. 시간은 UTC 기준.
    - cron: "17 */4 * * *"
  # 👇 Actions 탭에서 '지금 바로 실행'을 누를 수 있게 하는 설정 (심사 당일에 유용!)
  workflow_dispatch:

# 앞선 실행이 아직 돌고 있으면 새로 시작하지 않는다
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # ✏️✏️✏️ 여기에 내 스트림릿 앱 주소를 넣으세요 ✏️✏️✏️
      APP_URL: "https://aiexplorer-gq6wkygwpooxcxklk3nccq.streamlit.app/?p=0500"

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 브라우저(크롬) 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 앱 깨우기 (실패하면 두 번 더 시도)
        run: |
          for i in 1 2 3; do
            echo "── 시도 $i ──"
            if python wake_app.py; then
              echo "성공!"
              exit 0
            fi
            echo "실패 — 30초 뒤 다시 시도합니다."
            sleep 30
          done
          echo "세 번 모두 실패했습니다."
          exit 1

      - name: 화면 사진 남기기 (확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 앱-화면
          path: |
            wake_ok.png
            wake_fail.png
          if-no-files-found: ignore
          retention-days: 7
